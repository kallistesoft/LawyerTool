name: Web app

# Builds the web app (engine in WebAssembly + Svelte UI), fetches the official
# IRCC pages for the rules watcher (watch/latest.json, public data only) and
# deploys everything to audit.kallistesoft.ca. Runs on every push to main and
# once a day, so the published rules snapshot is never older than a day.
#
# The site and the snapshot are deployed together on purpose: the FTP deploy
# deletes files it uploaded earlier that are missing from the new upload.
#
# FTP_SERVER, FTP_USERNAME and FTP_PASSWORD are the kallistesoft organization
# secrets (free plan: they reach public repositories, which this one is).

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *' # 05:17 Montréal (EDT), 04:17 (EST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # "demo": automatic test vault without passphrase (no real client data).
  # Set to "production" for the real encrypted vault file.
  UI_MODE: demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          wasm-bindgen --version 2>/dev/null | grep -q 0.2.129 || cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Test
        run: cargo test -p web -p vault-file -p rules-watcher --locked
      - name: Build engine and UI
        run: |
          ./scripts/build-wasm.sh
          npm ci --prefix ui --ignore-scripts --no-fund
          npm --prefix ui run check
          npm --prefix ui run build -- --mode "$UI_MODE"
      - name: Rules watcher snapshot
        run: |
          mkdir -p ui/dist/watch
          cargo run --release --locked -p rules-watcher --bin watch-publish -- ui/dist/watch/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: ui/dist
          include-hidden-files: true # .htaccess

  deploy:
    needs: build
    uses: kallistesoft/kallistesoft-site/.github/workflows/deploy-ftp.yml@main
    with:
      folder: audit.kallistesoft.ca
    secrets: inherit
