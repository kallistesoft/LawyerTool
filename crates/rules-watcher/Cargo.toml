[package]
name = "rules-watcher"
description = "Fetches official IRCC pages, rebuilds a candidate rules grid, diffs it against the approved one; never sees client data"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fetching and parsing the official pages (CI publisher, desktop app). Off
# in the web app, which only compares the published result with its vault.
default = ["collect"]
collect = ["dep:grid-parser", "dep:net", "dep:audit", "dep:url", "dep:sha2", "dep:tokio"]

[dependencies]
applicant = { path = "../applicant" }
rules-engine = { path = "../rules-engine" }
grid-parser = { path = "../grid-parser", optional = true }
net = { path = "../net", optional = true }
audit = { path = "../audit", optional = true }
url = { version = "=2.5.8", optional = true }
sha2 = { version = "=0.11.1", optional = true }
tokio = { version = "1", features = ["macros", "rt"], optional = true }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "watch-publish"
required-features = ["collect"]

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
