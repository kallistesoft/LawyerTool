[package]
name = "lawyertool"
description = "LawyerTool desktop app (Tauri shell)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lawyertool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde.workspace = true
serde_json.workspace = true
vault = { path = "../crates/vault" }
applicant = { path = "../crates/applicant" }
rules-engine = { path = "../crates/rules-engine" }
deid = { path = "../crates/deid" }
report = { path = "../crates/report" }
tauri-plugin-dialog = "=2.8.3"
audit = { path = "../crates/audit" }
net = { path = "../crates/net" }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "zip"] }
semver = "1"
url = "=2.5.8"
zeroize = "=1.9.1"

[lints]
workspace = true
